name: Feature request
description: Ask for a new feature or a change.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you try to do, and what stops you?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What do you want GitIssue to do?
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Other ways
      description: Other solutions that you thought about.
